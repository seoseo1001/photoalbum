            ctx.fillText(signParts.join(" · "), centerX, Math.min(height - 180, cursorY + 48));
          }

          ctx.fillStyle = palette.inkMuted;
          ctx.font = '500 22px "Plus Jakarta Sans", "Noto Sans KR", sans-serif';
          ctx.fillText(`${pad2(totalPages)} / ${pad2(totalPages)}`, centerX, height - 110);

          return { canvas, width, height };
        }

        function buildPrintFallback() {
          const palette = ALBUM_THEMES[state.theme] || ALBUM_THEMES.white;
          const fontCfg = ALBUM_FONTS[state.font] || ALBUM_FONTS.myeongjo;
          const frag = document.createDocumentFragment();
          const totalPages = getTotalBookPages();
          const albumName = state.albumTitle.trim() || "포토 앨범";

          // Cover Sheet
          const coverSheet = document.createElement("div");
          coverSheet.className = "print-sheet";
          coverSheet.style.backgroundColor = palette.bg;
          coverSheet.style.color = palette.ink;
          coverSheet.innerHTML =
            `<div style="font-size:12px;color:${palette.inkMuted};letter-spacing:0.12em;">ALBUM COVER</div>` +
            '<div style="margin:auto 0;">' +
            `<h1 style="margin:0 0 16px 0;font-family:${fontCfg.cssFamily};font-size:40px;color:${palette.ink};"></h1>` +
            `<p style="margin:0;font-family:${fontCfg.cssFamily};font-size:20px;color:${palette.inkSecondary};"></p>` +
            "</div>" +
            `<div style="border-top:1px solid ${palette.border};padding-top:16px;display:flex;gap:32px;font-family:${fontCfg.cssFamily};font-size:16px;color:${palette.ink};"></div>`;
          coverSheet.querySelector("h1").textContent = albumName;
          coverSheet.querySelector("p").textContent = state.coverSubtitle || "";
          const metaBox = coverSheet.lastElementChild;
          if (state.coverAuthor.trim()) {
            const s = document.createElement("span");
            s.textContent = `이름: ${state.coverAuthor.trim()}`;
            metaBox.appendChild(s);
          }
          if (state.coverDate.trim()) {
            const s = document.createElement("span");
            s.textContent = `날짜: ${state.coverDate.trim()}`;
            metaBox.appendChild(s);
          }
          frag.appendChild(coverSheet);

          // Photo Sheets
          state.photos.forEach((photo, idx) => {
            const sheet = document.createElement("div");
            sheet.className = "print-sheet";
            sheet.style.backgroundColor = palette.bg;
            sheet.style.color = palette.ink;

            const header = document.createElement("div");
            header.style.cssText =
              `display:flex;justify-content:space-between;font-size:12px;color:${palette.inkMuted};border-bottom:1px solid ${palette.border};padding-bottom:8px;`;
            header.innerHTML = `<span></span><span>${pad2(idx + 2)} / ${pad2(totalPages)}</span>`;
            header.firstElementChild.textContent = albumName;

            const photoBox = document.createElement("div");
            photoBox.className = "print-sheet-photo";
            const img = document.createElement("img");
            img.src = photo.url;
            photoBox.appendChild(img);

            const caption = document.createElement("div");
            const h2 = document.createElement("h2");
            h2.style.cssText = `margin:0 0 8px 0;font-family:${fontCfg.cssFamily};font-size:20px;color:${palette.ink};`;
            h2.textContent = photo.title || "";
            const p = document.createElement("p");
            p.style.cssText = `margin:0;font-family:${fontCfg.cssFamily};font-size:14px;line-height:1.6;color:${palette.inkSecondary};white-space:pre-wrap;`;
            p.textContent = photo.description || "";
            caption.appendChild(h2);
            caption.appendChild(p);

            sheet.appendChild(header);
            sheet.appendChild(photoBox);
            sheet.appendChild(caption);
            frag.appendChild(sheet);
          });

          // Closing Sheet
          const closingSheet = document.createElement("div");
          closingSheet.className = "print-sheet";
          closingSheet.style.cssText =
            `justify-content:center;align-items:center;text-align:center;background-color:${palette.bg};color:${palette.ink};`;
          const closingP = document.createElement("p");
          closingP.style.cssText =
            `max-width:540px;font-family:${fontCfg.cssFamily};font-size:18px;line-height:1.8;color:${palette.ink};white-space:pre-wrap;`;
          closingP.textContent = state.closingMessage || "";
          closingSheet.appendChild(closingP);
          frag.appendChild(closingSheet);

          els.printAllPages.innerHTML = "";
          els.printAllPages.appendChild(frag);
        }

        async function exportCurrentPageToPng() {
          if (state.photos.length === 0) return;

          els.exportPngBtn.disabled = true;
          try {
            await ensureActiveFontLoaded();
            const totalPages = getTotalBookPages();
            let result;
            let pageSuffix;

            if (isCoverPage()) {
              result = await renderCoverToCanvas(state.orientation);
              pageSuffix = "표지";
            } else if (isClosingPage()) {
              result = await renderClosingToCanvas(state.orientation, totalPages);
              pageSuffix = "마무리";
            } else {
              const photoIdx = getCurrentPhotoIndex();
              result = await renderPageToCanvas(
                state.photos[photoIdx],
                state.currentIndex,
                totalPages,
                state.orientation,
                state.albumTitle
              );
              pageSuffix = `${pad2(state.currentIndex + 1)}쪽`;
            }

            const rawName = (state.albumTitle || "포토앨범")
              .trim()
              .replace(/[\\/:*?"<>|]/g, "_");
            const fileName = `${rawName || "포토앨범"}_${pageSuffix}.png`;

            const link = document.createElement("a");
            link.href = result.canvas.toDataURL("image/png");
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast(`${pageSuffix} PNG 이미지가 저장되었습니다.`, false);
          } catch (error) {
            console.error(error);
            showToast("PNG 저장 중 오류가 발생했습니다. 다시 시도해 주세요.", false);
          } finally {
            els.exportPngBtn.disabled = state.photos.length === 0;
          }
        }

        async function exportToPdf() {
          if (state.photos.length === 0) return;

          if (!window.jspdf || !window.jspdf.jsPDF) {
            buildPrintFallback();
            showToast("PDF 라이브러리를 불러오지 못해 브라우저 인쇄(PDF 저장) 창을 엽니다.", false);
            window.print();
            return;
          }

          els.exportPdfBtn.disabled = true;
          els.exportPngBtn.disabled = true;
          els.pdfModal.hidden = false;
          els.pdfProgressFill.style.width = "0%";
          els.pdfModalStatus.textContent = "글꼴과 페이지를 준비하고 있습니다...";

          try {
            await ensureActiveFontLoaded();

            const { jsPDF } = window.jspdf;
            const isLandscape = state.orientation === "landscape";
            const pdfWidth = isLandscape ? 297 : 210;
            const pdfHeight = isLandscape ? 210 : 297;

            const doc = new jsPDF({
              orientation: state.orientation,
              unit: "mm",
              format: "a4",
              compress: true,
            });

            const totalPages = getTotalBookPages();

            // 1. Cover Page
            els.pdfModalStatus.textContent = `1 / ${totalPages} 쪽 (표지) 생성 중...`;
            await new Promise((r) => setTimeout(r, 16));
            const coverResult = await renderCoverToCanvas(state.orientation);
            doc.addImage(
              coverResult.canvas.toDataURL("image/jpeg", 0.92),
              "JPEG",
              0,
              0,
              pdfWidth,
              pdfHeight,
              undefined,
              "FAST"
            );
            els.pdfProgressFill.style.width = Math.round((1 / totalPages) * 100) + "%";

            // 2. Photo Pages
            for (let i = 0; i < state.photos.length; i++) {
              const pageNum = i + 2;
              els.pdfModalStatus.textContent = `${pageNum} / ${totalPages} 쪽 생성 중...`;
              await new Promise((r) => setTimeout(r, 16));

              const { canvas } = await renderPageToCanvas(
                state.photos[i],
                pageNum - 1,
                totalPages,
                state.orientation,
                state.albumTitle
              );

              const imgData = canvas.toDataURL("image/jpeg", 0.92);
              doc.addPage("a4", state.orientation);
              doc.addImage(imgData, "JPEG", 0, 0, pdfWidth, pdfHeight, undefined, "FAST");
              els.pdfProgressFill.style.width = Math.round((pageNum / totalPages) * 100) + "%";
            }

            // 3. Closing Page
            els.pdfModalStatus.textContent = `${totalPages} / ${totalPages} 쪽 (마무리) 생성 중...`;
            await new Promise((r) => setTimeout(r, 16));
            const closingResult = await renderClosingToCanvas(state.orientation, totalPages);
            doc.addPage("a4", state.orientation);
            doc.addImage(
              closingResult.canvas.toDataURL("image/jpeg", 0.92),
              "JPEG",
              0,
              0,
              pdfWidth,
              pdfHeight,
              undefined,
              "FAST"
            );
            els.pdfProgressFill.style.width = "100%";

            const rawName = (state.albumTitle || "포토앨범")
              .trim()
              .replace(/[\\/:*?"<>|]/g, "_");
            doc.save(`${rawName || "포토앨범"}.pdf`);
            showToast("PDF 앨범 파일이 저장되었습니다.", false);
          } catch (error) {
            console.error(error);
            showToast("PDF 생성 중 오류가 발생했습니다. 다시 시도해 주세요.", false);
          } finally {
            els.pdfModal.hidden = true;
            els.exportPdfBtn.disabled = state.photos.length === 0;
            els.exportPngBtn.disabled = state.photos.length === 0;
          }
        }

        // Event Listeners
        els.emptyUploadBtn.addEventListener("click", () => els.fileInput.click());
        els.addPhotosBtn.addEventListener("click", () => els.fileInput.click());

        els.fileInput.addEventListener("change", (e) => {
          if (e.target.files && e.target.files.length > 0) {
            handleFiles(e.target.files);
            e.target.value = "";
          }
        });

        // Drag & Drop support on both Empty Dropzone and Album Page Card
        function attachDropEvents(element) {
          ["dragenter", "dragover"].forEach((evt) => {
            element.addEventListener(evt, (e) => {
              e.preventDefault();
              e.stopPropagation();
              element.classList.add("is-dragover");
            });
          });
          ["dragleave", "drop"].forEach((evt) => {
            element.addEventListener(evt, (e) => {
              e.preventDefault();
              e.stopPropagation();
              element.classList.remove("is-dragover");
            });
          });
          element.addEventListener("drop", (e) => {
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
              handleFiles(e.dataTransfer.files);
            }
          });
        }

        attachDropEvents(els.emptyDropZone);
        attachDropEvents(els.albumPageCard);

        // Album Title & Cover Fields Sync
        els.albumTitleInput.addEventListener("input", (e) => {
          state.albumTitle = e.target.value;
          els.pageAlbumLabel.textContent = state.albumTitle.trim() || "포토 앨범";
          if (isCoverPage()) {
            els.coverTitleInput.value = state.albumTitle;
          }
        });

        els.coverTitleInput.addEventListener("input", (e) => {
          state.albumTitle = e.target.value;
          els.albumTitleInput.value = state.albumTitle;
          els.pageAlbumLabel.textContent = state.albumTitle.trim() || "포토 앨범";
        });

        els.coverSubtitleInput.addEventListener("input", (e) => {
          state.coverSubtitle = e.target.value;
        });

        els.coverAuthorInput.addEventListener("input", (e) => {
          state.coverAuthor = e.target.value;
          updateClosingSignoff();
        });

        els.coverDateInput.addEventListener("input", (e) => {
          state.coverDate = e.target.value;
          updateClosingSignoff();
        });

        els.closingMessageInput.addEventListener("input", (e) => {
          state.closingMessage = e.target.value;
          autoResizeClosingTextarea(els.closingMessageInput);
        });

        // Per-photo Title & Description Sync
        els.photoTitleInput.addEventListener("input", (e) => {
          const photoIdx = getCurrentPhotoIndex();
          const current = photoIdx >= 0 ? state.photos[photoIdx] : null;
          if (current) {
            current.title = e.target.value;
            els.currentPhotoImg.alt = current.title || `사진 ${photoIdx + 1}`;
          }
        });

        els.photoDescInput.addEventListener("input", (e) => {
          const photoIdx = getCurrentPhotoIndex();
          const current = photoIdx >= 0 ? state.photos[photoIdx] : null;
          if (current) {
            current.description = e.target.value;
          }
          autoResizeTextarea(els.photoDescInput);
        });

        // Prev / Next Navigation
        els.prevPageBtn.addEventListener("click", () => goToPage(state.currentIndex - 1));
        els.nextPageBtn.addEventListener("click", () => goToPage(state.currentIndex + 1));
        els.mobilePrevBtn.addEventListener("click", () => goToPage(state.currentIndex - 1));
        els.mobileNextBtn.addEventListener("click", () => goToPage(state.currentIndex + 1));

        // Page Reordering & Deletion
        els.moveLeftBtn.addEventListener("click", () => moveCurrentPage(-1));
        els.moveRightBtn.addEventListener("click", () => moveCurrentPage(1));
        els.deletePageBtn.addEventListener("click", deleteCurrentPage);
        els.toastUndoBtn.addEventListener("click", undoDelete);

        // Album Font Segmented Control
        els.fontGothicBtn.addEventListener("click", () => {
          state.font = "gothic";
          render();
        });
        els.fontMyeongjoBtn.addEventListener("click", () => {
          state.font = "myeongjo";
          render();
        });
        els.fontHandwritingBtn.addEventListener("click", () => {
          state.font = "handwriting";
          render();
        });

        // Album Theme Segmented Control
        els.themeWhiteBtn.addEventListener("click", () => {
          state.theme = "white";
          render();
        });
        els.themeBeigeBtn.addEventListener("click", () => {
          state.theme = "beige";
          render();
        });
        els.themeBrownBtn.addEventListener("click", () => {
          state.theme = "brown";
          render();
        });

        // Orientation Segmented Control
        els.orientLandscapeBtn.addEventListener("click", () => {
          state.orientation = "landscape";
          render();
        });
        els.orientPortraitBtn.addEventListener("click", () => {
          state.orientation = "portrait";
          render();
        });

        // PNG & PDF Export
        els.exportPngBtn.addEventListener("click", exportCurrentPageToPng);
        els.exportPdfBtn.addEventListener("click", exportToPdf);

        // Lightbox Preview
        els.currentPhotoImg.addEventListener("click", () => {
          const photoIdx = getCurrentPhotoIndex();
          const current = photoIdx >= 0 ? state.photos[photoIdx] : null;
          if (!current) return;
          els.lightboxImg.src = current.url;
          els.lightbox.hidden = false;
        });

        function closeLightbox() {
          els.lightbox.hidden = true;
          els.lightboxImg.src = "";
        }

        els.lightboxCloseBtn.addEventListener("click", closeLightbox);
        els.lightbox.addEventListener("click", (e) => {
          if (e.target === els.lightbox) closeLightbox();
        });

        // Keyboard Shortcuts (ArrowLeft / ArrowRight / Escape)
        document.addEventListener("keydown", (e) => {
          if (!els.lightbox.hidden && e.key === "Escape") {
            closeLightbox();
            return;
          }

          const tag = document.activeElement ? document.activeElement.tagName : "";
          if (tag === "INPUT" || tag === "TEXTAREA") return;
          if (state.photos.length === 0) return;

          if (e.key === "ArrowLeft") {
            e.preventDefault();
            goToPage(state.currentIndex - 1);
          } else if (e.key === "ArrowRight") {
            e.preventDefault();
            goToPage(state.currentIndex + 1);
          }
        });

        // Initial Render
        render();
      })();
    </script>
  </body>
</html>
